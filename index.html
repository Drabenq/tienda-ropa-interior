<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1520">
  <title>Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="masthead">
    <p class="wordmark" id="store-name"></p>
    <p class="tagline" id="tagline"></p>
  </header>

  <nav class="filters" aria-label="Filtros">
    <div class="chips" id="category-filter" role="group" aria-label="Categoría"></div>
    <label class="size-filter">Talle
      <select id="size-filter"><option value="">Todos</option></select>
    </label>
  </nav>

  <main>
    <p class="notice" id="notice" role="status" hidden></p>
    <ul class="catalog" id="catalog" aria-live="polite"></ul>
  </main>

  <button class="bag-bar" id="bag-bar" type="button" hidden>
    <span id="bag-count"></span>
    <span id="bag-total"></span>
  </button>

  <dialog class="bag" id="bag" aria-labelledby="bag-title">
    <div class="bag-head">
      <h2 id="bag-title">Tu pedido</h2>
      <button class="close" type="button" id="bag-close" aria-label="Cerrar">✕</button>
    </div>
    <ul class="bag-items" id="bag-items"></ul>
    <div class="bag-foot">
      <p class="bag-total-line">Total <strong id="bag-dialog-total"></strong></p>
      <a class="btn primary" id="send-order" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
      <p class="fine">Te respondemos por WhatsApp para coordinar el pago y el envío.</p>
    </div>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
